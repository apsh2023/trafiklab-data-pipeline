name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: ruff check .

      - name: Validate transformed data
        run: |
          python scripts/transform_sl_lines.py --input data/sl_lines_raw.json --output data/sl_lines_transformed.json
          python scripts/validate_transform.py --input data/sl_lines_transformed.json

      - name: Run tests
        run: pytest -q
